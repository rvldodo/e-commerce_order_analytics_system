services:
  db:
    image: postgres:16-alpine
    container_name: db_archipelago
    restart: always
    user: postgres
    secrets:
      - db-archipelago-password
      - db-archipelago-user
    volumes:
      - db-archipelago-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER_FILE=/run/secrets/db-archipelago-user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-archipelago-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app-network

secrets:
  db-archipelago-password:
    file: ./secrets/password.txt
  db-archipelago-user:
    file: ./secrets/user.txt

volumes:
  db-archipelago-data:

networks:
  app-network:
    driver: bridge
